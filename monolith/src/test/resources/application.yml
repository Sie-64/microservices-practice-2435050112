server:
  port: 8080

spring:
  application:
    name: monolith

  datasource:
    # 连接本地 MySQL 的 smart_car 数据库，加上了时区和防公钥检索报错的参数
    url: jdbc:mysql://localhost:3306/smart_car?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    # ⚠️ 重要：请把下面这个密码换成你电脑上真实的 MySQL 密码！
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # update 表示如果表不存在会自动创建，如果表存在则更新结构
      ddl-auto: update
    # 在控制台打印出执行的 SQL 语句，方便你截图交作业
    show-sql: true
    properties:
      hibernate:
        # 格式化 SQL，让它打印出来换行更好看
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        # 暴露健康检查和基本信息接口（Actuator 要求）
        include: health,info
  endpoint:
    health:
      # 始终显示健康检查的详细信息
      show-details: always