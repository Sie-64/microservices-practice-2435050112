server:
  port: 8080

spring:
  application:
    name: monolith
  spring:
  datasource:
    # 把原来的 localhost 换成 mysql-db
    url: jdbc:mysql://mysql-db:3306/smart_car?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 12345678 
  jpa:
    hibernate:
      ddl-auto: update   # 自动建表更新
    show-sql: true       # 在控制台打印 SQL 语句
    properties:
      hibernate:
        format_sql: true # 格式化 SQL

management:
  endpoints:
    web:
      exposure:
        include: health,info