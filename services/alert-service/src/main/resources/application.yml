server:
  port: 8083
spring:
  application:
    name: alert-service
  datasource:
    # 1. 连自己的数据库：mysql-alert 的 alert_db
    url: jdbc:mysql://mysql-alert:3306/alert_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: COURSE_GROUP
management:
  endpoints:
    web:
      exposure:
        include: health,info

# 2. 跨服务调用：必须用 docker 服务名 vehicle-service
vehicle:
  service:
    url: http://vehicle-service:8082/api/vehicles
