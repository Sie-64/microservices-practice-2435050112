server:
  port: 8082
spring:
  application:
    name: vehicle-service
  datasource:
    url: jdbc:mysql://mysql-vehicle:3306/vehicle_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: COURSE_GROUP
management:
  endpoints:
    web:
      exposure:
        include: health,info
