server:
  port: 8082
spring:
  application:
    name: vehicle-service
  datasource:
    url: jdbc:mysql://mysql-vehicle:3306/vehicle_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: ${NACOS_GROUP:COURSE_GROUP}
management:
  endpoints:
    web:
      exposure:
        include: health,info
