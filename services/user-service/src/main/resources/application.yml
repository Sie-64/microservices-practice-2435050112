server:
  port: 8081
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://mysql-user:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12345678 # ⚠️ 换成你的真实密码
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        group: COURSE_GROUP
management:
  endpoints:
    web:
      exposure:
        include: health,info
