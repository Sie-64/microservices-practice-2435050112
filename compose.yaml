services:
  # ================= 3个独立数据库 =================
  mysql-user:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: user_db
    volumes:
      - user_data:/var/lib/mysql

  mysql-vehicle:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: vehicle_db
    volumes:
      - vehicle_data:/var/lib/mysql

  mysql-alert:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: alert_db
    volumes:
      - alert_data:/var/lib/mysql

  # ================= 3个独立微服务 =================
  user-service:
    build: ./services/user-service
    ports:
      - "8081:8081"
    depends_on:
      - mysql-user

  vehicle-service:
    build: ./services/vehicle-service
    ports:
      - "8082:8082"
    depends_on:
      - mysql-vehicle

  alert-service:
    build: ./services/alert-service
    ports:
      - "8083:8083"
    depends_on:
      - mysql-alert
      - vehicle-service
    environment:
      # 环境变量覆盖（老师要求），证明我们可以在 Docker 外部控制地址
      - VEHICLE_SERVICE_URL=http://vehicle-service:8082/api/vehicles

volumes:
  user_data:
  vehicle_data:
  alert_data: