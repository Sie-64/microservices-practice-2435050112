services:
  # ================= Nacos 注册中心 =================
  nacos:
    image: nacos/nacos-server:v3.2.4
    platform: linux/amd64
    container_name: nacos-standalone
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_ADMIN_ENABLE=true
      - NACOS_AUTH_CONSOLE_ENABLE=true
      - NACOS_AUTH_SYSTEM_TYPE=nacos
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - JVM_XMS=128m
      - JVM_XMX=256m
      - JVM_XMN=64m
      - JVM_MS=64m
      - JVM_MMS=192m
    ports:
      - "18080:8080"  # 控制台
      - "8848:8848"   # 服务端
      - "9848:9848"   # gRPC
    volumes:
      - nacos_data:/home/nacos/data

  # ================= 3个数据库 =================
  mysql-user:
    image: mysql:8.4.11
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=8M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: user_db
    volumes:
      - user_data:/var/lib/mysql

  mysql-vehicle:
    image: mysql:8.4.11
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=8M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: vehicle_db
    volumes:
      - vehicle_data:/var/lib/mysql

  mysql-alert:
    image: mysql:8.4.11
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=8M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: alert_db
    volumes:
      - alert_data:/var/lib/mysql

  mysql-driving:
    image: mysql:8.4.11
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=8M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: driving_db
    volumes:
      - driving_data:/var/lib/mysql

  mysql-carbon:
    image: mysql:8.4.11
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=8M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: carbon_db
    volumes:
      - carbon_data:/var/lib/mysql

  # ================= 5个微服务 =================
  user-service:
    build: ./services/user-service
    ports:
      - "8081:8081"
    depends_on:
      - mysql-user
      - nacos
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=${NACOS_PASSWORD:-123456}
      - MYSQL_PASSWORD=12345678
      - JAVA_TOOL_OPTIONS=-Xms48m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Xss512k

  vehicle-service:
    build: ./services/vehicle-service
    ports:
      - "8082:8082"
    depends_on:
      - mysql-vehicle
      - nacos
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=${NACOS_PASSWORD:-123456}
      - MYSQL_PASSWORD=12345678
      - JAVA_TOOL_OPTIONS=-Xms48m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Xss512k

  alert-service:
    build: ./services/alert-service
    ports:
      - "8083:8083"
    depends_on:
      - mysql-alert
      - nacos
      - vehicle-service
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=${NACOS_PASSWORD:-123456}
      - MYSQL_PASSWORD=12345678
      - JAVA_TOOL_OPTIONS=-Xms48m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Xss512k

  driving-behavior-service:
    build: ./services/driving-behavior-service
    ports:
      - "8084:8084"
    depends_on:
      - mysql-driving
      - nacos
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=${NACOS_PASSWORD:-123456}
      - MYSQL_PASSWORD=12345678
      - JAVA_TOOL_OPTIONS=-Xms48m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Xss512k

  carbon-service:
    build: ./services/carbon-service
    ports:
      - "8085:8085"
    depends_on:
      - mysql-carbon
      - nacos
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=${NACOS_PASSWORD:-123456}
      - MYSQL_PASSWORD=12345678
      - JAVA_TOOL_OPTIONS=-Xms48m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Xss512k

volumes:
  nacos_data:
  user_data:
  vehicle_data:
  alert_data:
  driving_data:
  carbon_data:
